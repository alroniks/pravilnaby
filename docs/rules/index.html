    <script>
      var list = document.querySelector('article ol');
      if (list) {
        var idx = 1;
        list.childNodes.forEach(function(node) {
          if (node.nodeType !== 1 || node.nodeName !== 'LI') return;
          var id = 'p' + idx;
          node.setAttribute('id', id);
          (function(li, anchorId) {
            var anchor = document.createElement('a');
            anchor.setAttribute('href', '#' + anchorId);
            anchor.setAttribute('class', 'point');
            anchor.textContent = '#';
            anchor.addEventListener('click', function(e) {
              e.preventDefault();
              history.pushState(null, '', '#' + anchorId);
              var url = location.href;
              navigator.clipboard.writeText(url).catch(function(){});
              li.classList.remove('point-flash');
              void li.offsetWidth;
              li.classList.add('point-flash');
            });
            li.appendChild(anchor);
          })(node, id);
          idx++;
        });
      }
    </script>
